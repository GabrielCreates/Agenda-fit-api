spring:
  application:
    name: agenda-fit

  datasource:
    url: jdbc:h2:mem:agendafit
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:agenda-fit-chave-secreta-do-projeto-diamante-2026}
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}

springdoc:
  swagger-ui:
    path: /swagger-ui.html